<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健身房力量训练动作图鉴 · 胸肩背腿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <div class="brand">
      <span class="brand-mark">💪</span>
      <span class="brand-text">力量训练图鉴</span>
    </div>
    <div class="nav-links" id="navLinks"></div>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
  </div>
</nav>

<!-- ============ 主视觉 Hero ============ -->
<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <span class="hero-tag" id="heroTag"></span>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-quote" id="heroQuote">
      <span class="hero-quote-mark">“</span><span class="hero-quote-text" id="heroQuoteText"></span><span class="hero-quote-mark">”</span>
    </div>
    <div class="hero-scroll" id="heroStats"></div>
    <a href="#categories" class="hero-cta">开始浏览 ↓</a>
  </div>
</header>

<!-- ============ 板块区 ============ -->
<main>
  <div class="quote-banner">
    <div class="quote-banner-track" id="quoteTrack"></div>
  </div>
  <section class="categories" id="categories"></section>
</main>

<!-- ============ 底部 ============ -->
<section class="closing">
  <span class="closing-mark">💪</span>
  <h2 class="closing-title">今天练的是肌肉，明天收获的是底气</h2>
  <p class="closing-sub">不必追求立竿见影，只要坚持，时间会给你答案。</p>
</section>

<footer class="footer">
  <p>健身房力量训练动作图鉴 · 仅作学习参考，训练前请充分热身并量力而行</p>
  <p class="footer-credit">素材来自开放授权图库 · 如需替换图片视频请编辑 <code>assets/data.js</code></p>
</footer>

<!-- ============ 动作详情弹层 ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ============ 视频播放弹层 ============ -->
<div class="player-overlay" id="playerOverlay">
  <button class="modal-close player-close" id="playerClose" aria-label="关闭">✕</button>
  <div class="player-stage">
    <div class="player-deco-left" data-deco="L"></div>
    <div class="player-core">
      <video class="player-video" id="playerVideo" controls playsinline></video>
    </div>
    <div class="player-deco-right" data-deco="R"></div>
  </div>
  <div class="player-label" id="playerLabel"></div>
</div>

<!-- 素材加载失败占位提示 -->
<div class="media-note" id="mediaNote"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
